<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>账号管理 - Solara</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/components/account.css"><style>body{min-height:100vh;padding:30px 18px;background:var(--background-color,#f4f6fa);color:var(--text-color,#202532);font-family:var(--font-main,system-ui,sans-serif)}main{max-width:1000px;margin:24px auto;padding:24px;border:1px solid var(--border-color,rgba(70,80,100,.15));border-radius:24px;background:var(--container-bg,rgba(255,255,255,.76));backdrop-filter:blur(20px)}h1{margin:18px 0 6px}.sub,.muted{opacity:.68}.admin-section{padding:18px 0;border-top:1px solid rgba(100,110,130,.15)}.admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(100,110,130,.1)}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-button{border:1px solid rgba(100,110,130,.25);border-radius:12px;padding:9px 13px;background:rgba(255,255,255,.58);color:inherit;cursor:pointer}.admin-button:disabled{opacity:.5}.admin-output{display:block;overflow-wrap:anywhere;padding:12px;border-radius:12px;background:rgba(80,100,140,.08);white-space:pre-wrap}.muted{font-size:13px}@media(max-width:640px){main{padding:18px}.admin-row{align-items:flex-start;flex-direction:column}}</style></head><body><main><a class="solara-account-button" href="/">返回播放器</a><h1>账号管理</h1><p class="sub">邀请新用户、管理账号状态并签发一次性密码重置链接。</p><section class="admin-section"><h2>邀请</h2><button class="admin-button" id="createInvite">创建七天有效邀请</button><p class="muted">邀请链接只显示一次，请安全地交给目标用户。</p><output class="admin-output" id="inviteOutput" hidden></output><div id="invites"></div></section><section class="admin-section"><h2>用户</h2><div id="users" aria-live="polite"></div></section><p id="adminStatus" role="status" aria-live="polite"></p></main><script type="module" src="/js/admin.js"></script></body></html>
