services:
  solara:
    image: solara:multi-user-v1
    build:
      context: .
      args:
        VCS_REF: ${GIT_SHA:-local}
    container_name: solara
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8787"
    environment:
      APP_ENV: production
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      API_BASE_URL: ${API_BASE_URL:-https://music-api.gdstudio.xyz/api.php}
      DATA_DIR: /data
      DB_PATH: /data/solara-multiuser.db
      HOST: 0.0.0.0
      PORT: 8787
      INTERNAL_PROXY_URL: http://127.0.0.1:8788
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-604800}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-172800}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      USER_API_PER_MINUTE: ${USER_API_PER_MINUTE:-120}
      SEARCH_PER_MINUTE: ${SEARCH_PER_MINUTE:-30}
      AUDIO_STREAMS_PER_USER: ${AUDIO_STREAMS_PER_USER:-2}
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
