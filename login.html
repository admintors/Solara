<!DOCTYPE html>
<html lang="zh-CN" class="login-page-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>登录 - Solara</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- 核心：直接复用主站设计系统 Tokens 与主题材质规范 -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>

  <style>
    /* ==========================================================================
       Solara Login Page - 100% 契合主站色彩与 Apple 拟态材质系统
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html.login-page-root {
      height: 100%;
      height: 100dvh;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    body.login-page {
      min-height: 100%;
      min-height: 100dvh;
      width: 100vw;
      font-family: var(--font-main);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 4vw, 40px);
      padding-top: calc(env(safe-area-inset-top, 0px) + clamp(20px, 4vw, 40px));
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4vw, 40px));
      background-color: transparent;
      transition: color 0.4s ease;
    }

    /* 顶部独立主题切换按钮 (与主站右上角保持统一) */
    .top-toolbar {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      right: calc(env(safe-area-inset-right, 0px) + 20px);
      z-index: 100;
    }

    .theme-toggle-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--component-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: var(--apple-glass-blur);
      -webkit-backdrop-filter: var(--apple-glass-blur);
      color: var(--text-color);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s var(--spring-snappy), background-color 0.25s ease, border-color 0.25s ease;
    }

    .theme-toggle-pill:hover {
      transform: scale(1.06);
    }

    .theme-toggle-pill:active {
      transform: scale(0.92);
    }

    .theme-toggle-pill .theme-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s var(--spring-snappy);
    }

    .theme-icon--moon {
      display: none;
    }

    body.dark-mode .theme-icon--sun {
      display: none;
    }

    body.dark-mode .theme-icon--moon {
      display: block;
    }

    /* ==========================================================================
       登录卡片：完全继承主站玻璃拟态卡片 (--container-bg 等 Tokens)
       ========================================================================== */
    .login-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 418px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      background: var(--container-bg);
      backdrop-filter: var(--apple-glass-blur);
      -webkit-backdrop-filter: var(--apple-glass-blur);
      border-radius: 28px;
      padding: clamp(32px, 5.5vw, 42px) clamp(28px, 5vw, 36px);
      border: 1px solid var(--apple-glass-border);
      border-top: 1px solid var(--apple-glass-border-top);
      box-shadow: var(--container-shadow);
      display: flex;
      flex-direction: column;
      gap: 28px;
      transition: transform 0.4s var(--spring-snappy), box-shadow 0.4s ease, border-color 0.3s ease;
      will-change: transform;
    }

    /* macOS 密码错误果冻横向晃动 */
    @keyframes appleShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-12px); }
      30% { transform: translateX(10px); }
      45% { transform: translateX(-7px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(2px); }
    }

    .login-card.shake {
      animation: appleShake 0.48s var(--spring-snappy);
    }

    .login-card.has-error {
      border-color: var(--warning-color, #ff3b30) !important;
      box-shadow:
        var(--container-shadow),
        0 0 0 2px rgba(255, 59, 48, 0.35),
        0 0 24px rgba(255, 59, 48, 0.25) !important;
    }

    /* ==========================================================================
       头部品牌区：彻底移除多余生硬方框，还原纯净灵动的 Solara 品牌质感
       ========================================================================== */
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    /* 纯粹的太阳光芒星徽，无任何多余方框容器 */
    .brand-symbol-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      color: var(--primary-color);
      filter: drop-shadow(0 4px 14px var(--palette-glow));
      transition: transform 0.35s var(--spring-bounce), color 0.3s ease;
    }

    .brand-symbol-wrap:hover {
      transform: scale(1.08) rotate(15deg);
    }

    .brand-symbol-icon {
      width: 48px;
      height: 48px;
      stroke: currentColor;
      fill: none;
      animation: sunGlowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes sunGlowPulse {
      0% { transform: scale(0.96); opacity: 0.88; }
      100% { transform: scale(1.04); opacity: 1; }
    }

    .title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* 主站标志性渐变标题字 */
    .login-title {
      font-size: clamp(1.8rem, 4vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--text-color) 35%, var(--primary-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.3s var(--spring-bounce);
    }

    .login-desc {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary-color);
      letter-spacing: -0.01em;
    }

    /* ==========================================================================
       表单与输入区 (继承主站组件材质)
       ========================================================================== */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-inline: 4px;
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-secondary-color);
      text-transform: uppercase;
    }

    /* Caps Lock 浮动提示药丸 */
    .caps-lock-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--component-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(2px) scale(0.92);
      pointer-events: none;
      transition: opacity 0.2s var(--spring-snappy), transform 0.2s var(--spring-snappy);
    }

    .caps-lock-indicator.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .caps-lock-indicator svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    /* 苹果密码输入胶囊框 */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--component-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0 14px;
      height: 52px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04) inset;
      transition:
        background-color 0.2s ease,
        border-color 0.25s var(--spring-snappy),
        box-shadow 0.25s var(--spring-snappy);
    }

    .input-wrapper:hover {
      border-color: var(--primary-color);
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
      box-shadow:
        0 0 0 3.5px var(--palette-glow),
        0 2px 8px rgba(0, 0, 0, 0.08) inset;
    }

    .input-leading-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin-right: 10px;
      color: var(--text-tertiary-color);
      transition: color 0.2s ease;
      flex-shrink: 0;
    }

    .input-wrapper:focus-within .input-leading-icon {
      color: var(--primary-color);
    }

    .login-form input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 0.03em;
      height: 100%;
    }

    .login-form input::placeholder {
      color: var(--text-tertiary-color);
      font-size: 0.94rem;
      letter-spacing: 0;
      transition: opacity 0.2s ease;
    }

    .login-form input:focus::placeholder {
      opacity: 0.55;
    }

    /* 眼睛切换按钮 */
    .input-action-btn {
      background: none;
      border: none;
      outline: none;
      padding: 6px;
      margin-left: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary-color);
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s ease, transform 0.15s var(--spring-snappy), background 0.15s ease;
    }

    .input-action-btn:hover {
      color: var(--text-color);
      background: var(--item-hover-bg);
    }

    .input-action-btn:active {
      transform: scale(0.9);
    }

    .input-action-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .login-hint {
      margin-top: 2px;
      font-size: 0.81rem;
      color: var(--text-tertiary-color);
      line-height: 1.45;
      text-align: center;
      letter-spacing: -0.01em;
    }

    /* ==========================================================================
       提交按钮：使用主站标准的 --primary-color
       ========================================================================== */
    .btn-submit {
      position: relative;
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 16px;
      background: var(--primary-color);
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow:
        0 14px 28px -6px var(--palette-glow),
        0 1px 0 rgba(255, 255, 255, 0.45) inset;
      transition:
        transform 0.12s var(--spring-snappy),
        box-shadow 0.2s ease,
        filter 0.2s ease,
        background-color 0.2s ease;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }

    body.dark-mode .btn-submit {
      color: #041611;
      font-weight: 700;
    }

    .btn-submit:hover {
      background: var(--primary-color-dark);
      filter: brightness(1.05);
      box-shadow:
        0 18px 34px -6px var(--palette-glow),
        0 1px 0 rgba(255, 255, 255, 0.6) inset;
    }

    .btn-submit:active {
      transform: scale(0.975);
      filter: brightness(0.96);
      box-shadow:
        0 8px 18px -4px var(--palette-glow),
        0 1px 0 rgba(255, 255, 255, 0.3) inset;
    }

    .btn-submit:disabled {
      cursor: not-allowed;
      opacity: 0.82;
      transform: none !important;
    }

    .btn-submit .btn-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.2s var(--spring-snappy);
    }

    .btn-submit:hover .btn-icon {
      transform: translateX(2px);
    }

    /* Apple 系统菊花 Spinner */
    .apple-spinner {
      display: none;
      width: 20px;
      height: 20px;
      position: relative;
    }

    .apple-spinner div {
      transform-origin: 10px 10px;
      animation: appleSpinner 0.8s linear infinite;
    }

    .apple-spinner div:after {
      content: " ";
      display: block;
      position: absolute;
      top: 1.5px;
      left: 9px;
      width: 2px;
      height: 5px;
      border-radius: 1px;
      background: currentColor;
    }

    .apple-spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -0.7s; }
    .apple-spinner div:nth-child(2) { transform: rotate(45deg); animation-delay: -0.6s; }
    .apple-spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }
    .apple-spinner div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
    .apple-spinner div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
    .apple-spinner div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
    .apple-spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
    .apple-spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

    @keyframes appleSpinner {
      0% { opacity: 1; }
      100% { opacity: 0.15; }
    }

    .btn-submit.loading .btn-text,
    .btn-submit.loading .btn-icon {
      display: none;
    }

    .btn-submit.loading .apple-spinner {
      display: block;
    }

    /* ==========================================================================
       底部安全状态胶囊
       ========================================================================== */
    .login-footer {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .security-capsule {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--component-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: var(--apple-glass-blur);
      -webkit-backdrop-filter: var(--apple-glass-blur);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-tertiary-color);
      letter-spacing: 0.01em;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .security-capsule:hover {
      border-color: var(--apple-glass-border);
      color: var(--text-secondary-color);
    }

    .pulse-dot {
      position: relative;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--primary-color);
      box-shadow: 0 0 8px var(--palette-glow);
    }

    .pulse-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid var(--primary-color);
      opacity: 0.6;
      animation: dotPulse 2.4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    @keyframes dotPulse {
      0% { transform: scale(0.8); opacity: 0.8; }
      70% { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ==========================================================================
       macOS Dynamic Island Style Toast (通知胶囊)
       ========================================================================== */
    .apple-toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 24px);
      left: 50%;
      transform: translate3d(-50%, -24px, 0) scale(0.92);
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 9999px;
      background: var(--container-bg);
      backdrop-filter: var(--apple-glass-blur);
      -webkit-backdrop-filter: var(--apple-glass-blur);
      border: 1px solid var(--apple-glass-border);
      border-top: 1px solid var(--apple-glass-border-top);
      box-shadow: var(--container-shadow);
      color: var(--text-color);
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.36s var(--spring-snappy),
        opacity 0.28s ease,
        border-color 0.25s ease;
    }

    .apple-toast.visible {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
      pointer-events: auto;
    }

    .apple-toast.error {
      border-color: rgba(255, 59, 48, 0.5);
    }

    .toast-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .apple-toast.error .toast-icon {
      color: var(--warning-color, #ff3b30);
    }

    .apple-toast.success .toast-icon {
      color: var(--primary-color);
    }

    /* 移动端响应式 */
    @media (max-width: 480px) {
      .login-shell {
        max-width: 100%;
      }

      .login-card {
        border-radius: 24px;
        padding: 30px 22px;
        gap: 24px;
      }

      .login-title {
        font-size: 1.7rem;
      }

      .btn-submit {
        height: 48px;
      }
    }
  
    .login-form[hidden],#register-panel[hidden],#reset-panel[hidden]{display:none!important}
    .auth-message{min-height:1.3em;text-align:center;color:var(--warning-color,#c8342e)}
    .auth-message.is-success{color:var(--primary-color,#4779e8)}
    .login-form .field{gap:8px}
    .login-form input{width:100%;border:0;outline:0;background:transparent;color:var(--text-color);font:inherit;padding:13px 15px}
    .login-form .input-wrapper{min-height:48px}
    .login-form .btn-submit{width:100%}
    @media(max-height:740px){.login-card{gap:18px;padding-top:24px;padding-bottom:24px}.brand-symbol-wrap{width:44px;height:44px}.brand-symbol-icon{width:38px;height:38px}}
  </style>
</head>
<body class="login-page">

  <!-- 100% 复用 Solara 主界面原生沉浸式极光流体舞台架构 -->
  <div class="background-stage" id="backgroundStage" aria-hidden="true">
    <div class="background-stage__layer background-stage__layer--base" id="backgroundBaseLayer">
      <div class="aurora-mesh">
        <div class="aurora-orb aurora-orb--1"></div>
        <div class="aurora-orb aurora-orb--2"></div>
        <div class="aurora-orb aurora-orb--3"></div>
        <div class="aurora-orb aurora-orb--4"></div>
      </div>
      <div class="aurora-noise"></div>
    </div>
    <div class="background-stage__glass-scrim"></div>
  </div>

  <!-- 顶部主题快速切换胶囊 (与主站右上角保持统一) -->
  <div class="top-toolbar">
    <button id="themeToggleBtn" class="theme-toggle-pill" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">
      <!-- 太阳 (浅色模式显示) -->
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2.5v1.5m0 16v1.5m-9.5-9.5H4m16 0h1.5m-2.6-6.4-.9.9M6.4 17.6l-.9.9m0-13 .9.9m11.3 11.3.9.9"></path>
      </svg>
      <!-- 月亮 (深色模式显示) -->
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        <path d="M19 3v4m2-2h-4"></path>
      </svg>
    </button>
  </div>

  <!-- macOS 悬浮 Toast 提示 -->
  <aside id="apple-toast" class="apple-toast" role="status" aria-live="polite">
    <span class="toast-icon" id="toast-icon"></span>
    <span class="toast-msg" id="toast-msg"></span>
  </aside>

  <!-- 主登录卡片 -->
  <main class="login-shell">
    <section class="login-card spotlight-card" id="login-card">
      
      <!-- 头部：彻底移除多余生硬方框，仅展示轻灵纯粹的太阳光芒星徽与品牌字 -->
      <header class="login-header">
        <div class="brand-symbol-wrap" aria-hidden="true">
          <svg class="brand-symbol-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"></path>
          </svg>
        </div>
        <div class="title-group">
          <h1 class="login-title">Solara</h1>
          <p class="login-desc">邀请制账号登录</p>
        </div>
      </header>

      <section id="login-panel">
        <form class="login-form" id="login-form" novalidate>
          <div class="field">
            <div class="field-header"><label for="login-username" class="field-label">用户名</label></div>
            <div class="input-wrapper"><input id="login-username" type="text" maxlength="32" autocomplete="username" required autocapitalize="none" spellcheck="false"></div>
          </div>
          <div class="field">
            <div class="field-header"><label for="login-password" class="field-label">密码</label></div>
            <div class="input-wrapper"><input id="login-password" type="password" autocomplete="current-password" required></div>
          </div>
          <p class="login-hint" id="auth-hint">账号由管理员邀请创建，登录信息只用于当前账号。</p>
          <button type="submit" class="btn-submit" id="login-submit"><span class="btn-text">进入 Solara</span><svg class="btn-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg><div class="apple-spinner" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></button>
        </form>
      </section>
      <section id="register-panel" hidden>
        <form class="login-form" id="register-form" novalidate>
          <div class="field"><div class="field-header"><label for="register-username" class="field-label">用户名</label></div><div class="input-wrapper"><input id="register-username" type="text" minlength="3" maxlength="32" autocomplete="username" required autocapitalize="none" spellcheck="false"></div></div>
          <div class="field"><div class="field-header"><label for="register-display" class="field-label">显示名称</label></div><div class="input-wrapper"><input id="register-display" type="text" maxlength="64" autocomplete="nickname" required></div></div>
          <div class="field"><div class="field-header"><label for="register-password" class="field-label">设置密码</label></div><div class="input-wrapper"><input id="register-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div></div>
          <p class="login-hint">用户名仅可使用小写字母、数字、下划线和连字符；密码至少 12 个字符。</p>
          <button type="submit" class="btn-submit" id="register-submit"><span class="btn-text">接受邀请并创建账号</span><svg class="btn-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg><div class="apple-spinner" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></button>
        </form>
      </section>
      <section id="reset-panel" hidden>
        <form class="login-form" id="reset-form" novalidate>
          <div class="field"><div class="field-header"><label for="reset-password" class="field-label">新密码</label></div><div class="input-wrapper"><input id="reset-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div></div>
          <p class="login-hint">重置链接只能使用一次，有效期为 30 分钟。</p>
          <button type="submit" class="btn-submit" id="reset-submit"><span class="btn-text">重置密码</span><svg class="btn-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg><div class="apple-spinner" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div></button>
        </form>
      </section>
      <p class="login-hint auth-message" id="auth-message" role="status" aria-live="polite"></p>

      <!-- 底部安全状态胶囊 -->
      <footer class="login-footer" aria-live="polite">
        <div class="security-capsule">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span class="security-text">安全状态：邀请制账号</span>
        </div>
      </footer>

    </section>
  </main>

  <script>
    (() => {
      const key = 'solara:v2:theme';
      const dark = localStorage.getItem(key) === 'dark';
      document.body.classList.toggle('dark-mode', dark);
      document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
        const next = !document.body.classList.contains('dark-mode');
        document.body.classList.toggle('dark-mode', next);
        localStorage.setItem(key, next ? 'dark' : 'light');
      });
    })();
  </script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
